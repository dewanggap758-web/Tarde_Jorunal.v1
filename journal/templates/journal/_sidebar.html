<aside class="app-sidebar">
    <a class="sidebar-brand" href="{% url 'dashboard' %}">
        <span class="sidebar-brand-mark" aria-hidden="true">TJ</span>
        <span class="sidebar-brand-name">Trade<span>Journal</span></span>
    </a>
    <p class="sidebar-caption">TRADING JOURNAL</p>

    <nav class="sidebar-navigation" aria-label="Navigasi utama">
        <a href="{% url 'dashboard' %}" class="sidebar-link{% if active_page == 'dashboard' %} active{% endif %}"{% if active_page == 'dashboard' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Overview</span>
        </a>
        <a href="{% url 'add_trade' %}" class="sidebar-link{% if active_page == 'add_trade' %} active{% endif %}"{% if active_page == 'add_trade' %} aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 6h13M8 9l2 2-2 2m4 0h3"/></svg>
            <span>Log Trade</span>
        </a>
        <a href="{% url 'dashboard' %}#trading-calendar" class="sidebar-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>
            <span>Kalender</span>
        </a>
    </nav>

    <div class="sidebar-user">
        <div class="sidebar-user-avatar">{{ request.user.username|first|upper }}</div>
        <div class="sidebar-user-details">
            <strong>{{ request.user.username }}</strong>
            <span>Trading Journal</span>
        </div>
        <a href="{% url 'logout' %}" class="sidebar-logout" aria-label="Keluar" title="Keluar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
        </a>
    </div>
</aside>
